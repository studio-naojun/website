<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio NaoJunへのお問い合わせ。制作相談、作品やサービスの利用方法、取材・掲載などはこちらから。">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action https://formsubmit.co; base-uri 'none'; object-src 'none'; upgrade-insecure-requests">
  <title>Contact | Studio NaoJun</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../">Studio NaoJun</a>
      <nav class="nav" aria-label="メインナビゲーション"><a href="../about/">About</a><a href="../works/">Works</a><a href="./" aria-current="page">Contact</a></nav>
    </div>
  </header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="eyebrow">Contact</div>
        <h1>お問い合わせ</h1>
        <p class="lead">作品やサービスの利用方法、制作相談、取材・掲載などはこちらからお送りください。</p>
      </div>
    </section>
    <section class="section alt">
      <div class="container">
        <div class="contact-box prose">
          <h2>お問い合わせフォーム</h2>
          <p>通常は数日以内の確認を予定しています。パスワード、認証コード、クレジットカード番号などの機密情報は送信しないでください。</p>

          <form id="contact-form" class="contact-form" method="POST" accept-charset="UTF-8">
            <input type="hidden" name="_subject" value="Studio NaoJun | Contact">
            <input type="hidden" name="_next" value="https://naojun.jp/contact/thanks/">
            <input type="hidden" name="_template" value="table">

            <div class="honeypot" aria-hidden="true">
              <label for="contact-website">Website</label>
              <input id="contact-website" type="text" name="_honey" tabindex="-1" autocomplete="off">
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="contact-name">お名前 <span class="optional-tag">任意</span></label>
                <input class="form-control" id="contact-name" type="text" name="name" maxlength="80" autocomplete="name">
              </div>
              <div class="form-field">
                <label for="contact-email">返信先メールアドレス <span class="required-tag">必須</span></label>
                <input class="form-control" id="contact-email" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" required>
              </div>
            </div>

            <div class="form-field">
              <label for="contact-topic">お問い合わせ種別 <span class="required-tag">必須</span></label>
              <select class="form-control" id="contact-topic" name="topic" required>
                <option value="" selected disabled>選択してください</option>
                <option value="作品・サービスの利用方法">作品・サービスの利用方法</option>
                <option value="制作相談">制作相談</option>
                <option value="取材・掲載">取材・掲載</option>
                <option value="その他">その他</option>
              </select>
            </div>

            <div class="form-field">
              <label for="contact-message">お問い合わせ内容 <span class="required-tag">必須</span></label>
              <textarea class="form-control" id="contact-message" name="message" rows="8" minlength="10" maxlength="5000" autocomplete="off" required aria-describedby="contact-message-help"></textarea>
              <p class="form-help" id="contact-message-help">10〜5,000文字。ファイル添付には対応していません。</p>
            </div>

            <label class="form-check" for="contact-privacy">
              <input id="contact-privacy" type="checkbox" required>
              <span><a class="text-link" href="../privacy/">プライバシーの取扱い</a>を確認し、送信内容が外部フォーム処理サービスを経由することに同意します。</span>
            </label>

            <div class="form-actions">
              <button class="button primary" type="submit">送信する</button>
            </div>
            <p class="form-note">迷惑送信対策として、送信時にFormSubmitのreCAPTCHA等による確認が表示される場合があります。</p>
          </form>
          <noscript><p class="note-box">このフォームの送信にはJavaScriptが必要です。</p></noscript>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span>© <span data-year></span> Studio NaoJun</span><span><a href="../privacy/">Privacy</a> · <a href="../">Home</a></span></div></footer>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/contact.js"></script>
</body>
</html>
