<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WordPress Blog Migration Prototype</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="site-shell">
    <header class="hero">
      <p class="eyebrow">Migration prototype</p>
      <h1>別Domain Blog</h1>
      <p>WordPressから静的サイトへ移行する前段階の公開側サンプルです。現在は実データを含みません。</p>
    </header>

    <section class="panel">
      <h2>サンプル記事</h2>
      <article class="card">
        <p class="meta">2026-08-07 / sample</p>
        <h3><a href="./posts/sample.html">移行前の表示確認用記事</a></h3>
        <p>記事本文・見出し・リンク・基本metadataの表示確認に使う仮記事です。</p>
      </article>
    </section>

    <section class="panel notice">
      <h2>Phase 1</h2>
      <p>このprototypeではWordPress exportの取込、実コメント、実認証データ接続はまだ有効化しません。</p>
    </section>
  </main>
</body>
</html>
