<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Legacy Comment Archive | Admin</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="admin-shell">
    <header class="hero">
      <p class="eyebrow">AUTHENTICATED PRIVATE ARCHIVE</p>
      <h1>旧コメントArchive</h1>
      <p id="connection-note">接続状態を確認しています。</p>
      <p><span id="live-status" class="badge">CHECKING</span></p>
    </header>

    <section id="login-panel" class="admin-card" hidden>
      <h2>管理者ログイン</h2>
      <form id="login-form">
        <p><label>Email<br><input id="login-email" type="email" autocomplete="username" required></label></p>
        <p><label>Password<br><input id="login-password" type="password" autocomplete="current-password" required></label></p>
        <button type="submit">ログイン</button>
      </form>
      <p id="login-message" class="status"></p>
    </section>

    <section id="workspace" hidden>
      <div class="admin-card">
        <p><span id="live-user" class="status"></span></p>
        <p>
          <button id="reload-btn" type="button">再読込</button>
          <button id="logout-btn" type="button">ログアウト</button>
        </p>
        <label>表示中のコメントを絞り込み<br><input id="filter-input" type="search" placeholder="記事slug・投稿者名・本文"></label>
      </div>

      <section class="admin-card">
        <h2>旧コメント</h2>
        <p id="result-summary" class="status"></p>
        <div id="comment-list"></div>
        <p><button id="load-more-btn" type="button">さらに読込</button></p>
      </section>
    </section>

    <section class="admin-card">
      <p class="private-note">この画面は公開URL上に存在しても、実コメントは認証済みAdminだけがDatabase RLS経由で取得します。Browser側の表示制御だけをSecurity境界にはしません。</p>
    </section>
  </main>

  <script src="./supabase-config.js"></script>
  <script src="./live-admin-loader.js"></script>
</body>
</html>
