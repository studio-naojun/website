<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} | NaoJun Investment Observatory</title>
  <link rel="stylesheet" href="../../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/investment.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../../../">Studio NaoJun</a>
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="../../../works/">Works</a>
        <a href="../../">Investment</a>
        <a href="../../../contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <header class="investment-article-hero">
      <div class="container">
        <div class="eyebrow">{{ARTICLE_TYPE}} / {{PUBLISHED_AT}}</div>
        <h1>{{TITLE}}</h1>
        <p class="article-deck">{{DECK}}</p>
        <div class="article-metadata">
          <span>As of {{AS_OF}}</span>
          <span>{{REGIME}}</span>
        </div>
      </div>
    </header>

    <article class="investment-article">
      {{ARTICLE_BODY}}

      <aside class="source-note">
        <strong>Sources &amp; note</strong>
        {{SOURCE_NOTE}}
        <p>本稿は公開時点のデータに基づく分析であり、個別の投資助言・将来収益の保証ではありません。</p>
      </aside>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span data-year></span> Studio NaoJun</span>
      <a href="../../">Investment Observatory</a>
    </div>
  </footer>
  <script src="../../../assets/js/main.js"></script>
</body>
</html>
