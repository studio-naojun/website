name: NAOJUN Markets Morning Pulse

on:
  schedule:
    - cron: '30 21 * * *'
  push:
    branches: [main]
    paths:
      - 'content/x-markets-daily.json'
      - 'scripts/x_markets_daily_publish.mjs'
      - 'scripts/x_markets_daily_publish.test.mjs'
      - '.github/workflows/x-markets-morning.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run makes no API call; publish-one posts today morning pulse at most once'
        type: choice
        default: dry-run
        required: true
        options:
          - dry-run
          - publish-one

permissions:
  contents: write

concurrency:
  group: naojun-markets-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Markets morning publisher
        run: node --test scripts/x_markets_daily_publish.test.mjs scripts/x_markets_post.test.mjs
      - name: Publish today's morning pulse at most once
        env:
          X_MARKETS_DAILY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish-one' }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_daily_publish.mjs
      - name: Persist morning publication receipt
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish-one'
        shell: bash
        run: |
          if git diff --quiet -- content/x-markets-state.json; then
            echo 'No morning publication receipt to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-markets-state.json
          git commit -m 'chore(markets): record morning X publication'
          git push
