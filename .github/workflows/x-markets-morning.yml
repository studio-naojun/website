name: NAOJUN Markets Morning Pulse

on:
  # Morning content remains available to GPT/NINA editorial selection.
  # This legacy workflow is diagnostic-only; no independent X posting.
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run makes no API call; publish-one posts today morning pulse at most once'
        type: choice
        default: dry-run
        required: true
        options:
          - dry-run

permissions:
  contents: write

concurrency:
  group: naojun-markets-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Markets morning publisher
        run: node --test scripts/x_account_runtime.test.mjs scripts/x_markets_daily_publish.test.mjs scripts/x_markets_post.test.mjs
      - name: Publish today's morning pulse at most once
        env:
          X_MARKETS_DAILY_MODE: dry-run
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_markets_daily_publish.mjs
      - name: Persist morning publication receipt
        if: false
        shell: bash
        run: |
          if git diff --quiet -- content/x-markets-state.json; then
            echo 'No morning publication receipt to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-markets-state.json
          git commit -m 'chore(markets): record morning X publication'
          git push
