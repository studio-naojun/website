name: Discovery SEO Smoke

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'admissions/feed.json'
      - 'investment/feed.json'
      - 'scripts/build_discovery.py'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'robots.txt'
      - '.github/workflows/discovery-smoke.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated discovery assets
        run: python scripts/build_discovery.py --check
