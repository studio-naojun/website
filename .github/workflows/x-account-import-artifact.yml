name: NAOJUN X Account Import Artifact

on:
  workflow_dispatch:
    inputs:
      target_handle:
        description: X handle without @
        required: true
        type: string
      token_run_id:
        description: Prior OAuth exchange run containing the short-lived token artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: naojun-x-account-credentials
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test sealed credential helper
        run: node --test scripts/x_account_credentials.test.mjs
      - name: Download short-lived token artifact
        uses: actions/download-artifact@v4
        with:
          name: oauth-token-${{ inputs.target_handle }}
          path: ${{ runner.temp }}/oauth-token
          repository: ${{ github.repository }}
          run-id: ${{ inputs.token_run_id }}
          github-token: ${{ github.token }}
      - name: Seal credential inside the runner
        env:
          TARGET_HANDLE: ${{ inputs.target_handle }}
          SOURCE_TOKEN_FILE: ${{ runner.temp }}/oauth-token/oauth-token.json
          CREDENTIALS_FILE: content/x-account-credentials.enc.json
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_account_credentials.mjs import
      - name: Verify decrypted credential against X
        env:
          TARGET_HANDLE: ${{ inputs.target_handle }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_account_verify.mjs
      - name: Persist ciphertext only
        shell: bash
        run: |
          if git diff --quiet -- content/x-account-credentials.enc.json; then
            echo 'No sealed credential change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-account-credentials.enc.json
          git commit -m "chore(x): seal @${{ inputs.target_handle }} credential"
          git pull --rebase origin main
          git push origin HEAD:main
