name: NaoJun Discovery Pulse

on:
  workflow_dispatch:
    inputs:
      publish_latest_bluesky:
        description: 'Post the latest Admissions and Investment entries to Bluesky'
        required: false
        default: false
        type: boolean
      update_bluesky_profile:
        description: 'Refresh the Studio NaoJun Bluesky profile text'
        required: false
        default: false
        type: boolean
      refresh_bluesky_handle:
        description: 'Re-validate the naojun.jp Bluesky handle'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 0 * * *'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'admissions/feed.json'
      - 'investment/feed.json'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'robots.txt'
      - 'scripts/**'
      - '.github/workflows/discovery-pulse.yml'

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh discovery assets
        run: python scripts/build_discovery.py
      - name: Commit refreshed discovery assets
        run: |
          if git diff --quiet; then
            echo "Discovery assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '**/*.html' sitemap.xml feed.xml robots.txt '*.txt'
          git commit -m "Refresh discovery metadata"
          git push
      - name: Notify IndexNow and WebSub
        run: python scripts/notify_discovery.py
      - name: Publish new entries to Bluesky
        if: github.event_name == 'push'
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python scripts/bluesky_publish.py --before "${{ github.event.before }}"
      - name: Publish latest entries to Bluesky
        if: github.event_name == 'workflow_dispatch' && inputs.publish_latest_bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python scripts/bluesky_publish.py --latest
      - name: Update Bluesky profile
        if: github.event_name == 'workflow_dispatch' && inputs.update_bluesky_profile
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python scripts/bluesky_profile.py
      - name: Refresh Bluesky handle
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_bluesky_handle
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python scripts/bluesky_profile.py --refresh-handle
