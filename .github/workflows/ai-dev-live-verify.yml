name: AI Developer Watch - Independent LIVE HTTP Acceptance
on:
  pull_request:
    paths:
      - 'ai-dev/live_verify.py'
      - 'ai-dev/test_live_verify.py'
      - '.github/workflows/ai-dev-live-verify.yml'
  push:
    branches: [main]
    paths:
      - 'ai-dev/**'
      - '.github/workflows/ai-dev-live-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-dev-live-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TDD (offline, includes origin staleness and retry bounds)
        run: python -m unittest discover -s ai-dev -p test_live_verify.py -v
  origin:
    if: github.event_name != 'pull_request'
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent live HTTP 200 and exact byte comparison (two bounded retries)
        run: python ai-dev/live_verify.py --receipt recovery-artifacts/ai-dev-live-proof.json
      - name: Preserve independent proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-live-proof-${{ github.run_id }}
          path: recovery-artifacts/
          if-no-files-found: warn
          retention-days: 14
