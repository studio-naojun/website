name: WordPress Blog Shell Smoke

on:
  pull_request:
    paths:
      - 'sites/wordpress-blog/**'
      - '.github/workflows/wordpress-blog-shell-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'sites/wordpress-blog/**'
      - '.github/workflows/wordpress-blog-shell-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run shell smoke
        run: node sites/wordpress-blog/ci-smoke.mjs
