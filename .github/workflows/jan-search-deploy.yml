name: Deploy JAN Search Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets
        shell: bash
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$YAHOO_CLIENT_ID"
          test -n "$RAKUTEN_APPLICATION_ID"
          test -n "$RAKUTEN_ACCESS_KEY"

      - name: Build secrets file
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = {
            YAHOO_CLIENT_ID: process.env.YAHOO_CLIENT_ID,
            RAKUTEN_APPLICATION_ID: process.env.RAKUTEN_APPLICATION_ID,
            RAKUTEN_ACCESS_KEY: process.env.RAKUTEN_ACCESS_KEY,
          };
          if (process.env.RAKUTEN_AFFILIATE_ID) data.RAKUTEN_AFFILIATE_ID = process.env.RAKUTEN_AFFILIATE_ID;
          fs.writeFileSync('/tmp/jan-search-secrets.json', JSON.stringify(data));
          NODE

      - name: Deploy Worker
        run: npx --yes wrangler@4.102.0 deploy --config worker/jan-search/wrangler.toml --secrets-file /tmp/jan-search-secrets.json

      - name: Remove local secrets file
        if: always()
        run: rm -f /tmp/jan-search-secrets.json
