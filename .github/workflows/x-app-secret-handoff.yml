name: NAOJUN X App Credential Handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test handoff helper
        run: node --test scripts/x_app_secret_export.test.mjs
      - name: Encrypt existing X app credentials for this one-time handoff
        env:
          PUBLIC_KEY_FILE: content/.x-app-handoff-public.pem
          OUTPUT_FILE: ${{ runner.temp }}/x-app-handoff.json
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_app_secret_export.mjs
      - name: Upload encrypted handoff
        uses: actions/upload-artifact@v4
        with:
          name: x-app-handoff
          path: ${{ runner.temp }}/x-app-handoff.json
          retention-days: 1
          if-no-files-found: error
