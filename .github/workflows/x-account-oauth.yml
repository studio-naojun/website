name: NAOJUN X Account OAuth

on:
  workflow_dispatch:
    inputs:
      mode:
        description: OAuth step
        type: choice
        required: true
        options:
          - request
          - exchange
      target_handle:
        description: X handle without @
        required: true
        type: string
      request_run_id:
        description: Request-step run ID that stores the encrypted OAuth state artifact
        required: false
        type: string
      verifier:
        description: One-time verifier/PIN shown by X
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: naojun-x-account-credentials
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth helper
        run: node --test scripts/x_account_oauth.test.mjs scripts/x_account_credentials.test.mjs
      - name: Request user authorization
        if: inputs.mode == 'request'
        env:
          TARGET_HANDLE: ${{ inputs.target_handle }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        shell: bash
        run: |
          result="$(node scripts/x_account_oauth.mjs request)"
          echo "AUTH_TARGET=$(jq -r .target <<<"$result")"
          echo "AUTH_URL=$(jq -r .authorizationUrl <<<"$result")"
          printf '%s' "$(jq -r .state <<<"$result")" > "$RUNNER_TEMP/oauth-state.txt"
      - name: Store encrypted request state
        if: inputs.mode == 'request'
        uses: actions/upload-artifact@v4
        with:
          name: oauth-state-${{ inputs.target_handle }}
          path: ${{ runner.temp }}/oauth-state.txt
          retention-days: 1
          if-no-files-found: error
      - name: Download encrypted request state
        if: inputs.mode == 'exchange'
        uses: actions/download-artifact@v4
        with:
          name: oauth-state-${{ inputs.target_handle }}
          path: ${{ runner.temp }}/oauth-state
          repository: ${{ github.repository }}
          run-id: ${{ inputs.request_run_id }}
          github-token: ${{ github.token }}
      - name: Exchange approved authorization
        if: inputs.mode == 'exchange'
        env:
          TARGET_HANDLE: ${{ inputs.target_handle }}
          OAUTH_STATE_FILE: ${{ runner.temp }}/oauth-state/oauth-state.txt
          OAUTH_VERIFIER: ${{ inputs.verifier }}
          OUTPUT_MODE: artifact
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        shell: bash
        run: |
          export OAUTH_STATE="$(cat "$OAUTH_STATE_FILE")"
          result="$(node scripts/x_account_oauth.mjs exchange)"
          echo "AUTHORIZED_USER=$(jq -r .username <<<"$result")"
          printf '%s' "$result" > "$RUNNER_TEMP/oauth-token.json"
      - name: Seal final user credential inside the runner
        if: inputs.mode == 'exchange'
        env:
          TARGET_HANDLE: ${{ inputs.target_handle }}
          SOURCE_TOKEN_FILE: ${{ runner.temp }}/oauth-token.json
          CREDENTIALS_FILE: content/x-account-credentials.enc.json
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_account_credentials.mjs import
      - name: Verify sealed credential against X
        if: inputs.mode == 'exchange'
        env:
          TARGET_HANDLE: ${{ inputs.target_handle }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_account_verify.mjs
      - name: Persist ciphertext only
        if: inputs.mode == 'exchange'
        shell: bash
        run: |
          if git diff --quiet -- content/x-account-credentials.enc.json; then
            echo 'No sealed credential change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-account-credentials.enc.json
          git commit -m "chore(x): seal @${{ inputs.target_handle }} credential"
          git pull --rebase origin main
          git push origin HEAD:main
