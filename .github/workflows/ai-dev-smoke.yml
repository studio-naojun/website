name: AI Developer Watch Smoke
on:
  pull_request:
    paths:
      - 'ai-dev/**'
      - 'scripts/build_discovery.py'
      - 'scripts/sync_studio.py'
      - '.github/workflows/ai-dev-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'ai-dev/**'
      - '.github/workflows/ai-dev-smoke.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ai-dev/smoke.py
