name: NAOJUN Markets Credential Migration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naojun-x-account-credentials
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test migration and sealed credential helpers
        run: node --test scripts/x_markets_credential_migrate.test.mjs scripts/x_account_credentials.test.mjs
      - name: Verify and seal existing Markets credential
        env:
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_credential_migrate.mjs
      - name: Verify sealed Markets credential without posting
        env:
          TARGET_HANDLE: naojun_markets
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_account_verify.mjs
      - name: Persist ciphertext only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-account-credentials.enc.json
          if git diff --cached --quiet; then
            echo 'No credential change.'
            exit 0
          fi
          git commit -m 'chore(x): seal @naojun_markets credential'
          git pull --rebase origin main
          git push origin HEAD:main
