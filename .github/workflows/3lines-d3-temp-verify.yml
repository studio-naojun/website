name: 3lines-d3-temp-verify
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/3lines/**'
      - '.github/workflows/3lines-d3-temp-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/3lines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Quality invariants
        run: npm run quality
      - name: JavaScript syntax
        run: |
          node --check src/stage-a.js
          node --check src/composer.js
          node --check src/main.js
          node --check src/summarizer.js
      - name: Deterministic composer semantic probe
        run: node tests/composer-probe.mjs
