name: NAOJUN Markets X API Test
on:
  pull_request:
    paths:
      - 'scripts/x_markets_post.mjs'
      - 'scripts/x_markets_post.test.mjs'
      - 'scripts/x_markets_oauth2_post.mjs'
      - 'scripts/x_markets_oauth2_post.test.mjs'
      - 'scripts/x_markets_auth_probe.mjs'
      - 'scripts/x_markets_fingerprint_compare.mjs'
      - 'scripts/x_markets_independent_verify.mjs'
      - '.github/workflows/x-markets-api-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/x_markets_post.mjs'
      - 'scripts/x_markets_post.test.mjs'
      - '.github/workflows/x-markets-api-test.yml'
  workflow_dispatch:
    inputs:
      publisher_key_suffix:
        description: 'Optional masked Consumer Key suffix for checking same X app; never enter the full key'
        type: string
        default: ''
        required: false
      secret_fingerprints:
        description: 'Diagnostic only: SHA256 fingerprints of 4 X Console keys; NEVER enter plaintext keys'
        type: string
        default: ''
        required: false
      mode:
        description: 'dry-run makes no API call; verify-only checks account via API; publish-test posts one labeled test'
        type: choice
        default: dry-run
        required: true
        options:
          - dry-run
          - verify-only
          - diagnose
          - compare-keys
          - verify-library
          - publish-test
permissions:
  contents: read
concurrency:
  group: naojun-markets-x-post
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test request signing, duplicate prevention and account guard
        run: node --test scripts/x_markets_post.test.mjs
      - name: Test OAuth2 publisher guards and no-post defaults
        run: node --test scripts/x_markets_oauth2_post.test.mjs
      - name: Check credential probe syntax
        run: node --check scripts/x_markets_auth_probe.mjs
      - name: Compare X Console and GitHub credential fingerprints without printing values
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'compare-keys'
        env:
          X_EXPECT_SECRET_SHA256: ${{ inputs.secret_fingerprints }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_fingerprint_compare.mjs
      - name: Probe app-only and OAuth1 credentials without posting
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose'
        env:
          X_EXPECT_API_KEY_SUFFIX: ${{ inputs.publisher_key_suffix }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_auth_probe.mjs
      - name: Install pinned independent OAuth client for verification
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-library'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund twitter-api-v2@1.29.1
      - name: Verify OAuth1 with independent X client (no post)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-library'
        env:
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_independent_verify.mjs
      - name: Preview or send single X API test post
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'diagnose' && inputs.mode != 'verify-library' && inputs.mode != 'compare-keys'
        env:
          X_POST_MODE: ${{ inputs.mode }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_post.mjs
