name: Investment Observatory Smoke

on:
  pull_request:
    paths:
      - 'investment/**'
      - '.github/workflows/investment-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'investment/**'
      - '.github/workflows/investment-smoke.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static investment publication
        run: node investment/smoke.mjs
