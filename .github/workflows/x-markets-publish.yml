name: NAOJUN Markets Publisher

on:
  schedule:
    - cron: '17 0,5,10 * * *'
  push:
    branches: [main]
    paths:
      - 'investment/feed.json'
      - 'scripts/x_markets_publish.mjs'
      - 'scripts/x_markets_publish.test.mjs'
      - '.github/workflows/x-markets-publish.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run makes no API call; publish-one publishes at most one unpublished Markets entry'
        type: choice
        default: publish-one
        required: true
        options:
          - dry-run
          - publish-one

permissions:
  contents: write

concurrency:
  group: naojun-markets-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Markets publisher
        run: node --test scripts/x_markets_publish.test.mjs scripts/x_markets_post.test.mjs
      - name: Publish at most one Markets entry
        env:
          X_MARKETS_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish-one' }}
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
          NAOJUN_X_ACCESS_TOKEN: ${{ secrets.NAOJUN_X_ACCESS_TOKEN }}
          NAOJUN_X_ACCESS_TOKEN_SECRET: ${{ secrets.NAOJUN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x_markets_publish.mjs
      - name: Persist publication receipt
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish-one'
        shell: bash
        run: |
          if git diff --quiet -- content/x-markets-state.json; then
            echo 'No publication receipt to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-markets-state.json
          git commit -m 'chore(markets): record X publication'
          git push
