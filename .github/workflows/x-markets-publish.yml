name: NAOJUN Markets Publisher

on:
  # Original market article auto-POSTs yield to NINA's central X publishing decision.
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run makes no API call; publish-one publishes at most one unpublished Markets entry'
        type: choice
        default: dry-run
        required: true
        options:
          - dry-run

permissions:
  contents: write

concurrency:
  group: naojun-markets-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Markets publisher
        run: node --test scripts/x_account_runtime.test.mjs scripts/x_markets_publish.test.mjs scripts/x_markets_post.test.mjs
      - name: Publish at most one Markets entry
        env:
          X_MARKETS_PUBLISH_MODE: dry-run
          NAOJUN_X_API_KEY: ${{ secrets.NAOJUN_X_API_KEY }}
          NAOJUN_X_API_SECRET: ${{ secrets.NAOJUN_X_API_SECRET }}
        run: node scripts/x_markets_publish.mjs
      - name: Persist publication receipt
        if: false
        shell: bash
        run: |
          if git diff --quiet -- content/x-markets-state.json; then
            echo 'No publication receipt to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/x-markets-state.json
          git commit -m 'chore(markets): record X publication'
          git push
