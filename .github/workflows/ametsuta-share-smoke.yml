name: Ametsuta score sharing smoke

on:
  pull_request:
    paths:
      - 'works/ametsuta/**'
      - 'tests/ametsuta-share.test.mjs'
      - '.github/workflows/ametsuta-share-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'works/ametsuta/**'
      - 'tests/ametsuta-share.test.mjs'
      - '.github/workflows/ametsuta-share-smoke.yml'

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate result sharing and integration
        run: node --test tests/ametsuta-share.test.mjs
