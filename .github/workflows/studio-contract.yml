name: Studio Design Contract
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'content/**'
      - '_partials/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'scripts/**'
      - 'investment/feed.json'
      - 'admissions/feed.json'
      - '.github/workflows/studio-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_studio_contract.py
      - run: python scripts/sync_studio.py --check
      - run: python scripts/design-integrity.py
      - run: python scripts/build_discovery.py --check
