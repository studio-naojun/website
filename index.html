<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Studio NaoJun</title>

  <style>
    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #222;
      background: #f7f7f5;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 120px 24px;
    }

    h1 {
      margin-bottom: 24px;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: -0.04em;
    }

    p {
      max-width: 620px;
      font-size: 18px;
      line-height: 1.9;
    }

    .status {
      margin-top: 48px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>
  <main>
    <h1>Studio NaoJun</h1>

    <p>
      プログラム、映像、ツール。
      私たちが作ったものを届けるための、小さなスタジオです。
    </p>

    <p class="status">
      Website under construction.
    </p>
  </main>
</body>
</html>
